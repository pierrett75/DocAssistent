# Popis projektu. Díky tomuto souboru jde balíček nainstalovat příkazem:
#     pip install -e .
# "-e" = editable: Python se dívá přímo do src/, takže změny v kódu platí hned
# a nemusíš instalovat znovu.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docassist"
version = "0.1.0"
description = "RAG asistent nad firemními dokumenty"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "python-dotenv",
    "numpy",
    "pypdf",
    "chromadb",
    "fastapi",
    "uvicorn",
    "python-multipart"
]

[tool.setuptools.packages.find]
where = ["src"]
